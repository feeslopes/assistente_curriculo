# Parâmetros objetivos do currículo.
# O aplicativo lê este arquivo a cada geração, então pode editar à vontade.
# As regras de escrita (tom, voz, estilo dos bullets) ficam em guidelines.md.

idioma_padrao: pt

# Limite de páginas do PDF. Se passar, o aplicativo avisa.
max_paginas: 2

# Tamanho do resumo, em palavras.
resumo_max_palavras: 70

# Máximo de bullets por experiência, da mais recente para a mais antiga.
# O último número vale para todas as experiências seguintes.
bullets_por_experiencia: [5, 4, 3, 2]

# Máximo de grupos na seção de competências.
max_grupos_competencias: 6

# Experiências antigas ficam resumidas, a menos que a vaga as torne relevantes.
# O espaço de cada experiência sai de três coisas, nesta ordem:
#   1. bullets_por_experiencia (acima): mais espaço para as mais recentes.
#   2. Se a experiência terminou há mais de "anos" anos, ou é uma das "mais_antigas" do seu
#      histórico (início de carreira, só quando sobram ao menos 3 recentes completas), vale o
#      teto "max_bullets" (0 = só cargo, empresa e datas). Se a análise da vaga mostra que
#      ela é relevante, o teto sobe para "max_bullets_relevante".
#   3. Você pode ajustar o número de cada experiência na tela, vaga por vaga, antes de gerar.
# Para desligar a regra de antiguidade, coloque ativo: false.
experiencias_antigas:
  ativo: true
  anos: 10
  mais_antigas: 2
  max_bullets: 1
  max_bullets_relevante: 3

# O que fazer com um item que a IA escreveu sem apontar um fato confirmado da base.
# remover = tira do currículo e mostra o que foi tirado (recomendado)
# manter_com_aviso = mantém e só avisa
bullets_sem_fonte: remover

# Ordem das seções. Para tirar uma seção, apague o nome daqui.
ordem_secoes: [resumo, competencias, experiencia, formacao, certificacoes, idiomas]

titulos_secoes:
  pt:
    resumo: Resumo
    competencias: Competências
    experiencia: Experiência Profissional
    formacao: Formação
    certificacoes: Certificações
    idiomas: Idiomas
  en:
    resumo: Summary
    competencias: Core Skills
    experiencia: Professional Experience
    formacao: Education
    certificacoes: Certifications
    idiomas: Languages

meses:
  pt: [Janeiro, Fevereiro, Março, Abril, Maio, Junho, Julho, Agosto, Setembro, Outubro, Novembro, Dezembro]
  en: [January, February, March, April, May, June, July, August, September, October, November, December]

atual:
  pt: Presente
  en: Present

separador_datas: "–"

# Acompanhamento das candidaturas (área Minhas candidaturas e painel de início)
candidaturas:
  dias_sem_retorno: 21      # depois disso, o app SUGERE marcar "Sem retorno" (nunca muda sozinho)
  minimo_para_taxas: 5      # candidaturas enviadas antes de mostrar a taxa de resposta
  minimo_para_relacao: 20   # antes disso, comparar aderência e resultado seria ruído

# Modelo por etapa (rótulo da chamada). Etapa que não aparece aqui usa MODELO do .env (ou o padrão do provedor).
# Só vale para o DeepSeek. Flash nas etapas de leitura e conferência custa cerca de 3 vezes menos que o Pro.
# Hipótese a validar com `python -m evals.rodar` antes de adotar: as notas de análise, termos e verificação não podem piorar.
# Para voltar tudo ao modelo padrão, deixe a lista vazia: modelos_por_etapa: {}
modelos_por_etapa: {}
#  analisador: deepseek-flash
#  verificador: deepseek-flash
#  tradutor_cargos: deepseek-flash

# Plano e limites de uso do servidor (só valem no modo hospedado; o app local não tem teto).
planos:
  mensal:  {dias: 30, geracoes: 60, aviso_em: 50}
  semanal: {dias: 7, geracoes: 15, aviso_em: 12}
limites_uso:
  regeracoes_por_vaga: 3        # além da primeira geração da vaga
  geracoes_por_hora: 10
